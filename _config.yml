# Site settings for srinivasannanduri.github.io
# Theme: Chirpy (https://github.com/cotes2020/jekyll-theme-chirpy), Harbor colours in _sass/harbor.scss

theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Kolkata

title: Srinivasan Nanduri
tagline: Notes on platforms, observability and the books behind them
description: >-
  Srinivasan Nanduri writes about cloud platforms, observability, reliability
  and engineering leadership, and recommends the books behind that work.

url: "https://srinivasannanduri.github.io"

github:
  username: srinivasannanduri

twitter:
  username: snanduri_

social:
  name: Srinivasan Nanduri
  email: # left empty on purpose so the address is not published
  links:
    - https://www.linkedin.com/in/srinivasannanduri
    - https://github.com/srinivasannanduri
    - https://x.com/snanduri_
    - https://www.goodreads.com/user/show/36011711-srinivasan-nanduri

webmaster_verifications:
  google:
  bing:

analytics:
  goatcounter:
    id:

pageviews:
  provider:

# Empty = follow the reader's system setting, with a light/dark toggle in the sidebar
theme_mode:

cdn:

avatar: /assets/img/avatar.jpg

social_preview_image: /assets/img/avatar.jpg

toc: true

comments:
  provider: # giscus can be added later

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - vendor

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
